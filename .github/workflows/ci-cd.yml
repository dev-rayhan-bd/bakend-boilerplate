name: K10 Football Backend CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Code Formatting (Prettier)
        run: yarn format

      - name: Code Linting (ESLint)
        run: yarn lint

      - name: Build TypeScript
        run: yarn build

      - name: Run Tests (Jest)
        run: yarn test

  cd:
    name: Continuous Deployment (AWS)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build TypeScript
        run: yarn build

      - name: Deploy to AWS (Placeholder)
        run: |
          echo "🚀 Starting Deployment to AWS..."
          echo "Replace this step with your actual AWS deployment command."
          echo "Example: aws deploy create-deployment --application-name k10-app ..."
