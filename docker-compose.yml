version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k10_football_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=mongodb://mongodb:27017/k10_football
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=b7bf13bed1c3924e58f39cdb7885804349412fe504d7120ad4a2513c75775043ec8c8825560391dcd222c51876f9e9fc356498a73d5cf01a92f3787d2912658e
      - JWT_ACCESS_EXPIRES_IN=1d
      - JWT_REFRESH_SECRET=31d05504c4e58536083bef9de27debaddd5f9458450dbf55ca7168a7f1600005dce4a9af602e3bbb8693d7d29089fa28cd7501498751de96ee276129b8b80668
      - JWT_REFRESH_EXPIRES_IN=365d
      - BCRYPT_SALT_ROUNDS=12
      - LOG_LEVEL=info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - k10_network

  mongodb:
    image: mongo:7.0
    container_name: k10_football_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - k10_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: k10_football_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - k10_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  k10_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
